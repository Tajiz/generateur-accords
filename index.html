<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de suites d'accords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5efe3;
    --surface: #ece1cd;
    --surface-2: #e2d3b8;
    --ink: #2b2119;
    --ink-soft: #6b5d4c;
    --accent: #a96f2b;
    --accent-ink: #fbf6ec;
    --line: rgba(43, 33, 25, 0.16);
    --shadow: rgba(74, 52, 26, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #211710;
      --surface: #2c2016;
      --surface-2: #392a1c;
      --ink: #f2e9d8;
      --ink-soft: #bba98d;
      --accent: #dcaa53;
      --accent-ink: #241a10;
      --line: rgba(242, 233, 216, 0.14);
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg: #211710;
    --surface: #2c2016;
    --surface-2: #392a1c;
    --ink: #f2e9d8;
    --ink-soft: #bba98d;
    --accent: #dcaa53;
    --accent-ink: #241a10;
    --line: rgba(242, 233, 216, 0.14);
    --shadow: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 44px 34px 34px;
    text-align: center;
    box-shadow: 0 24px 60px -30px var(--shadow);
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(24px, 4.4vw, 32px);
    line-height: 1.25;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 30px;
    line-height: 1.5;
  }

  .switch {
    display: inline-flex;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 34px;
    gap: 2px;
  }

  .switch button {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .switch button.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .switch button:focus-visible,
  .generate:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .slots {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    min-height: 96px;
    align-items: center;
    margin-bottom: 36px;
  }

  .slot {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(30px, 7vw, 44px);
    min-width: 64px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--line);
    color: var(--ink);
    transition: color 0.15s ease, border-color 0.3s ease;
  }

  .slot.empty {
    color: var(--ink-soft);
  }

  .slot.settled {
    border-color: var(--accent);
  }

  .generate {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    padding: 15px 38px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 10px 24px -12px var(--shadow);
  }

  .generate:hover {
    transform: translateY(-1px);
  }

  .generate:active {
    transform: translateY(0px) scale(0.98);
  }

  .diagrams {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 8px;
    min-height: 118px;
    align-items: flex-start;
  }

  .diagrams.empty-state {
    align-items: center;
  }

  .diagrams-hint {
    color: var(--ink-soft);
    font-size: 13px;
  }

  .diagram {
    width: 78px;
  }

  .diagram svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .diagram-label {
    display: block;
    margin-top: 6px;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 15px;
    color: var(--ink);
  }

  .pool {
    margin-top: 30px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.7;
  }

  .pool strong {
    color: var(--ink);
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .generate, .slot { transition: none; }
  }
</style>
</head>
<body>

<main class="card">
  <h1>Génère une suite d'accords</h1>
  <p class="sub">Choisis une longueur, appuie sur le bouton, et joue ce qui sort.</p>

  <div class="switch" role="group" aria-label="Nombre d'accords">
    <button type="button" id="btn3" onclick="setLength(3)">3 accords</button>
    <button type="button" id="btn4" onclick="setLength(4)" class="active">4 accords</button>
  </div>

  <div class="slots" id="slots" aria-live="polite"></div>

  <button type="button" class="generate" onclick="generate()">Générer</button>

  <div class="diagrams empty-state" id="diagrams" aria-live="polite">
    <span class="diagrams-hint">Les schémas de tablature s'affichent ici après génération.</span>
  </div>

  <p class="pool"><strong>Accords utilisés</strong><br>C · A · Am · E · Em · D · Dm · G</p>
</main>

<script>
  const CHORDS = ['C', 'A', 'Am', 'E', 'Em', 'D', 'Dm', 'G'];
  // Position ouverte, du Mi grave (corde 6) au Mi aigu (corde 1).
  // 'x' = corde étouffée, 0 = corde à vide, 1-4 = numéro de case.
  const SHAPES = {
    C:  ['x', 3, 2, 0, 1, 0],
    A:  ['x', 0, 2, 2, 2, 0],
    Am: ['x', 0, 2, 2, 1, 0],
    E:  [0, 2, 2, 1, 0, 0],
    Em: [0, 2, 2, 0, 0, 0],
    D:  ['x', 'x', 0, 2, 3, 2],
    Dm: ['x', 'x', 0, 2, 3, 1],
    G:  [3, 2, 0, 0, 0, 3]
  };
  let length = 4;
  let current = new Array(length).fill(null);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function chordSVG(name) {
    const frets = SHAPES[name];
    const xs = [10, 26, 42, 58, 74, 90];
    const fretY = [20, 36, 52, 68, 84];
    let s = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">';

    // cordes
    xs.forEach(x => {
      s += `<line x1="${x}" y1="20" x2="${x}" y2="84" stroke="var(--ink-soft)" stroke-width="1.2"/>`;
    });

    // frettes (la première plus épaisse = sillet)
    fretY.forEach((y, i) => {
      s += `<line x1="10" y1="${y}" x2="90" y2="${y}" stroke="var(--ink-soft)" stroke-width="${i === 0 ? 3 : 1}"/>`;
    });

    // symboles et positions des doigts
    frets.forEach((f, i) => {
      const x = xs[i];
      if (f === 'x') {
        s += `<text x="${x}" y="11" text-anchor="middle" font-size="11" fill="var(--ink-soft)">×</text>`;
      } else if (f === 0) {
        s += `<circle cx="${x}" cy="8" r="4" fill="none" stroke="var(--ink-soft)" stroke-width="1.4"/>`;
      } else {
        const y = 20 + 16 * (f - 0.5);
        s += `<circle cx="${x}" cy="${y}" r="6.5" fill="var(--accent)"/>`;
      }
    });

    s += '</svg>';
    return s;
  }

  function renderDiagrams(chords) {
    const el = document.getElementById('diagrams');
    if (!chords || chords.length === 0 || chords.some(c => !c)) {
      el.className = 'diagrams empty-state';
      el.innerHTML = '<span class="diagrams-hint">Les schémas de tablature s\'affichent ici après génération.</span>';
      return;
    }
    el.className = 'diagrams';
    el.innerHTML = chords.map(c => `
      <div class="diagram">
        ${chordSVG(c)}
        <span class="diagram-label">${c}</span>
      </div>
    `).join('');
  }

  function setLength(n) {
    length = n;
    current = new Array(length).fill(null);
    document.getElementById('btn3').classList.toggle('active', n === 3);
    document.getElementById('btn4').classList.toggle('active', n === 4);
    render(false);
    renderDiagrams(null);
  }

  function render(settled) {
    const container = document.getElementById('slots');
    container.innerHTML = '';
    for (let i = 0; i < length; i++) {
      const el = document.createElement('span');
      const value = current[i];
      el.className = 'slot' + (value ? '' : ' empty') + (settled ? ' settled' : '');
      el.textContent = value || '–';
      container.appendChild(el);
    }
  }

  function pickChord(previous) {
    let choice = previous;
    while (choice === previous) {
      choice = CHORDS[Math.floor(Math.random() * CHORDS.length)];
    }
    return choice;
  }

  function generate() {
    const final = [];
    let prev = null;
    for (let i = 0; i < length; i++) {
      const c = pickChord(prev);
      final.push(c);
      prev = c;
    }

    if (reduceMotion) {
      current = final;
      render(true);
      renderDiagrams(current);
      return;
    }

    renderDiagrams(null);
    let ticks = 0;
    const maxTicks = 8;
    const interval = setInterval(() => {
      current = current.map(() => CHORDS[Math.floor(Math.random() * CHORDS.length)]);
      render(false);
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(interval);
        current = final;
        render(true);
        renderDiagrams(current);
      }
    }, 60);
  }

  render(false);
</script>

</body>
</html>
